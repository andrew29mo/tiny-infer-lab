name: Build and correctness
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        blas: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical benchmark source snapshots must be available.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.12'
      - name: Install Linux system BLAS
        if: runner.os == 'Linux' && matrix.blas == 1
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Correctness, sanitizers and mutation detection
        run: make BLAS=${{ matrix.blas }} demo test sanitize mutation
      - name: Build option regression
        run: make build-check
      - name: Publication history and archived measurement audit
        run: make publication-check
      - name: Benchmark smoke test (not a performance gate)
        run: python3 tools/run_benchmark.py --blas ${{ matrix.blas }} --runs 1 --samples 6 --repetitions 1024 --shapes 8x16x4,31x17x9
      - name: Retain raw smoke-test measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-${{ matrix.os }}-blas${{ matrix.blas }}
          path: results/local/
          if-no-files-found: ignore
          retention-days: 14

  real-model:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.12'
      - name: Install optional reference dependencies
        run: python -m pip install -r requirements-real-model.txt
      - name: Install Linux system BLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Trained-model correctness on production objects
        run: |
          python tools/real_model.py build --blas 1
          python tests/test_real_model.py build/real_engine.so
          python -O tests/test_real_model.py build/real_engine.so
          python tests/test_mutations.py --blas 1 --real-model
      - name: Archived real-model evidence
        run: |
          python tests/test_real_report.py
          python -O tests/test_real_report.py
      - name: Real-model timing smoke (not a performance gate)
        run: python tools/real_model.py benchmark --runs 1 --samples 2

      - name: Matched-batch production-object correctness and fault detection
        run: |
          python tools/batch_model.py build --blas 1
          python tests/test_batch_model.py build/real_engine.so
          python -O tests/test_batch_model.py build/real_engine.so
          python tests/test_batch_mutations.py --blas 1
      - name: Archived matched-batch evidence
        run: |
          python tests/test_batch_report.py
          python -O tests/test_batch_report.py
      - name: Matched-batch timing smoke (not a performance gate)
        run: python tools/batch_model.py benchmark --runs 1 --samples 2 --batches 1,8,128,450

  providers:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node.js 24
        with:
          python-version: '3.12'
      - name: Install optional comparison dependencies
        run: python -m pip install -r requirements-comparison.txt
      - name: Install Linux system BLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Export exact frozen model and build production adapters
        run: python tools/compare_providers.py prepare
      - name: Correctness, actual calls and compiled fault detection
        run: |
          python tests/test_providers.py
          python -O tests/test_providers.py
      - name: Archived provider evidence and corrupt-report rejection
        run: |
          python tests/test_provider_report.py
          python -O tests/test_provider_report.py
      - name: Timing and isolated RSS smoke (not a performance gate)
        run: |
          python tools/compare_providers.py benchmark --runs 1 --samples 1 --repeats 1 --memory-runs 1 --batches 8,128
          python tools/verify_providers.py results/local/providers
